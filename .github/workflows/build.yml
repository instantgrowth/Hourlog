name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the android/ folder (not stored in this repo)
      - name: Create platform files
        run: flutter create --platforms=android --project-name hourlog --org com.example .

      - run: flutter pub get

      - name: Build debug APK (for testing on your phone)
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: hourlog-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
